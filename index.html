<title>Cruce de Cargos</title>
<style id="fi-style">
:root{
  --ink:#221D19; --muted:#6E655C; --paper:#F5F7F6; --surface:#FFFFFF;
  --line:#E3E1DC; --line-strong:#CFCBC2;
  --accent:#2D7B6B;
  --good:#2D7B6B; --good-bg:#E4F1EE;
  --warn:#B8712F; --warn-bg:#F8ECDD;
  --bad:#A6433D; --bad-bg:#F7E6E4;
  --neutral:#6B7581; --neutral-bg:#EBEAE7;
  --shadow: 0 1px 2px rgba(34,29,25,0.06), 0 8px 24px -12px rgba(34,29,25,0.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECE8E1; --muted:#A79E92; --paper:#141B19; --surface:#1B2422;
    --line:#2B3532; --line-strong:#3A4642;
    --accent:#59B39F;
    --good:#59B39F; --good-bg:#1E3833;
    --warn:#E0A15C; --warn-bg:#3A2E1D;
    --bad:#E08880; --bad-bg:#3B2422;
    --neutral:#9AA3AC; --neutral-bg:#2A2F33;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --ink:#ECE8E1; --muted:#A79E92; --paper:#141B19; --surface:#1B2422;
  --line:#2B3532; --line-strong:#3A4642;
  --accent:#59B39F;
  --good:#59B39F; --good-bg:#1E3833;
  --warn:#E0A15C; --warn-bg:#3A2E1D;
  --bad:#E08880; --bad-bg:#3B2422;
  --neutral:#9AA3AC; --neutral-bg:#2A2F33;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.45}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;text-wrap:balance;margin:0}
a{color:var(--accent)}
#root{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 20px 14px}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px}
.brand h1{font-size:22px;font-weight:600;letter-spacing:-0.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.pill:hover{border-color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.readonly-banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 14px;font-size:12.5px;margin:14px 0}
section{margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:19px;font-weight:600}
.section-head .note{color:var(--muted);font-size:12.5px;max-width:540px}
.kpi-grid{display:grid;grid-template-columns:1.05fr 2fr;gap:16px}
@media (max-width:820px){.kpi-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.hero-card{padding:26px 26px 22px;display:flex;flex-direction:column;justify-content:center}
.hero-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero-num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:54px;font-weight:600;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.hero-sub{color:var(--muted);font-size:13px;margin-top:10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.stat{padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:25px;font-weight:600}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .pct{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.bars{padding:18px 22px 20px;display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:150px 1fr 104px;align-items:center;gap:10px}
.bar-row .name{font-size:13px;font-weight:600}
.bar-track{background:var(--neutral-bg);border-radius:5px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px}
.bar-val{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;text-align:right;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:9px 13px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13.5px;font-family:inherit}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.count-badge{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1120px;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper)}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.sin{background:var(--bad-bg);color:var(--bad)}
.chip.fuera{background:var(--warn-bg);color:var(--warn)}
.chip.sede{background:var(--neutral-bg);color:var(--neutral);font-weight:600}
.chip.confirm{background:var(--good-bg);color:var(--good)}
tr.row-confirmed td{background:var(--good-bg)}
tr.row-confirmed:hover td{background:var(--good-bg)}
tr.row-justified td{background:var(--neutral-bg)}
tr.row-justified:hover td{background:var(--neutral-bg)}
.chip.justified{background:var(--surface);color:var(--neutral);border:1px solid var(--line-strong)}
tr.row-falta-check td{background:var(--warn-bg)}
tr.row-falta-check:hover td{background:var(--warn-bg)}
.chip.falta-check{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.confirm-check{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px;cursor:pointer}
.confirm-check input{accent-color:var(--good);cursor:pointer}
.cargo-cell{font-size:12px;color:var(--muted);max-width:220px}
.cargo-cell .cc{color:var(--ink);display:block;margin-bottom:1px}
.diff{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;white-space:nowrap}
.comment-input{width:220px;min-height:42px;resize:vertical;padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font-family:inherit;font-size:12.5px}
.comment-input:focus{outline:2px solid var(--accent);outline-offset:1px}
.comment-input:disabled{opacity:.65;cursor:not-allowed}
.save-state{font-size:10.5px;color:var(--muted);margin-top:3px;min-height:12px}
.descuento-grid{display:flex;flex-direction:column;gap:16px}
.descuento-card-title{font-size:14px;font-weight:600;padding:16px 18px 2px}
.descuento-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.descuento-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.descuento-table td{padding:9px 18px;border-bottom:1px solid var(--line)}
.descuento-table tr:last-child td{border-bottom:none;padding-bottom:16px}
.descuento-table td.money{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
footer{margin-top:48px;color:var(--muted);font-size:11.5px;text-align:center}
</style>
<link rel="stylesheet" id="fi-font-link" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">

<script>
window.__FI_DATA__ = null;
window.__FI_COMMENTS__ = null;
</script>
<script id="fi-app-src">
(function () {
  'use strict';

  // Los datos ya NO viven embebidos en esta página: se piden en vivo al Apps
  // Script Web App conectado a tu Google Sheet (motor de cruce + comentarios
  // compartidos). Cambia esta URL si vuelves a desplegar el script y te da una
  // nueva.
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw8-TQXycv5JJTe-EF945bCwtmW3DcUW7U2mC8enpvDB4AxzYgoghZqzP7zcBx4hjoKKg/exec';

  var DATA = [];
  var COMMENTS = {};
  var CORTE_LABEL = 'Cargando…';

  // Filas de CARGOS con % Dto. > 0 -- viene directo del motor (buildDescuentoRecords),
  // independiente de DATA (esa es agenda cruzada contra cargos; esto es CARGOS puro).
  // r.fecha aquí es la fecha del cargo (F. Cargo), no de una cita, pero es compatible
  // con byMes() para que la sección respete el mismo filtro de mes que el resto.
  var DESCUENTOS = [];

  // Cruce de PGTs - Proveedor y cargos (buildCrucePGT): por cada factura de
  // proveedor de PGT ("Base proveedores PGT"), si el paciente tiene o no un cargo
  // en CARGOS con un concepto de "Regla proveedores PGT" columna G dentro del mes
  // de recepción de la muestra y/o de entrega del reporte. Viene ya calculado del
  // motor -- aquí solo se filtra por mes (fecha de recepción) y se busca por texto.
  var CRUCE_PGT = [];

  var SEDES = [
    { key: 'ALL', label: 'Todas las sedes' },
    { key: 'CDMX', label: 'Ciudad de México' },
    { key: 'GDL', label: 'Guadalajara' },
    { key: 'Metepec', label: 'Metepec' }
  ];

  var GRUPO_ORDER = ['Consultorio', 'Primera Vez', 'Quirófano', 'Seguimiento', 'Wellness', 'Laboratorio FIVANDRO'];

  // Orden preferido de ejecutivas (las de la hoja "Experiencia"); cualquier otra
  // que aparezca en los datos se agrega al final, y "Sin asignar" siempre al final.
  // 2026-09-25: Reyna salió del catálogo (Giovanni López Salamanca pasó a Ana);
  // Eva es nueva (tomó a Jairo Hernando Pedraza Pinto y Monica Olavarria, antes
  // de Lucía). Si alguna de estas vuelve a tener citas asignadas, reaparece sola
  // en el filtro vía getEjecutivas() aunque no esté aquí -- esta lista es solo
  // el orden preferido, no una lista cerrada.
  var EJECUTIVA_ORDER = ['Ana', 'Sharon', 'Eva', 'Lucía', 'Jacqueline', 'Jimena', 'Wendy', 'Alondra', 'Viviana', 'Externos'];

  function getEjecutivas() {
    var present = {};
    DATA.forEach(function (r) { if (r.ejecutiva) present[r.ejecutiva] = true; });
    var known = EJECUTIVA_ORDER.filter(function (e) { return present[e]; });
    var extra = Object.keys(present).filter(function (e) {
      return known.indexOf(e) === -1 && e !== 'Sin asignar';
    }).sort();
    var list = known.concat(extra);
    if (present['Sin asignar']) list.push('Sin asignar');
    return list;
  }

  var STATUS_META = {
    'Match Encontrado': { short: 'Match', varName: '--good', bgVar: '--good-bg' },
    'Fuera de Rango de Fecha': { short: 'Fuera de Rango', varName: '--warn', bgVar: '--warn-bg' },
    // Incluye tanto "no aplica por regla" como los duplicados GDL (2+ citas idénticas
    // -- mismo paciente+fecha+concepto -- que generan un solo cargo real: todas menos
    // la primera de cada grupo se reclasifican aquí en el motor, para que ese cargo
    // real no se cuente varias veces en Match/Fuera de Rango).
    'No Aplica Cruce (regla)': { short: 'No Aplica', varName: '--neutral', bgVar: '--neutral-bg' },
    // Reclasificación automática por texto de comentario (ver justificaSinCargo) --
    // el equipo explicó por qué NO se espera cargo (excepción clínica/operativa) sin
    // necesidad de marcar la casilla "Ya tiene cargo" (que es para lo contrario: sí
    // hay cargo, solo falta vincularlo).
    'Justificado (Sin Cargo)': { short: 'Justificado', varName: '--neutral', bgVar: '--neutral-bg' },
    'Sin Match': { short: 'Sin Match', varName: '--bad', bgVar: '--bad-bg' },
    // El motor marca así una cita cuyo concepto no tiene NINGUNA fila en Reglas (ni
    // SI ni NO) -- no es que falte el cargo, es que todavía no le hemos dicho al
    // sistema qué esperar de ese concepto. Antes esto quedaba fuera de todos los
    // conteos (ni resuelto ni pendiente), lo que hacía que el % no cerrara contra el
    // total mostrado. Ahora cuenta como pendiente y aparece en "Casos a revisar".
    'Concepto No Definido en Reglas': { short: 'Sin Regla', varName: '--bad', bgVar: '--bad-bg' }
  };

  // Frases con las que el equipo documenta, en el comentario, que NO se espera un
  // cargo para ese caso (excepción clínica u operativa: p.ej. inseminación que no
  // requiere perfil hormonal, ciclo cancelado, paciente que no llegó a cita). Son
  // distintas de "Ya tiene cargo": ahí el equipo confirma que SÍ hubo cargo (solo no
  // se encontró); aquí confirma que no debía haberlo. Cuando un comentario coincide
  // y la casilla "Ya tiene cargo" no está marcada, el caso cuenta como resuelto en el
  // % de arriba (ver effectiveStatus) pero se mantiene visible en "Casos a revisar"
  // con su propio chip, por si hace falta corregirlo. La lista se basa en los
  // patrones reales vistos en los comentarios del equipo -- amplíala si aparecen
  // frases nuevas y consistentes.
  var SIN_CARGO_PATTERNS = [
    // 2026-10-01: "\b" justo después de una vocal acentuada (ó) no funciona como
    // límite de palabra en JS cuando lo que sigue es fin de cadena o puntuación
    // (ninguno de los dos lados es "\w", así que no hay frontera) -- por eso
    // "no se cargó." o "no se cargó" (sin nada después) NO se detectaban. Se
    // corrige con (?!\w) en vez de \b en los patrones que terminan justo en
    // la vocal acentuada.
    /\bno\s+(se\s+)?(carga|cargó|cobra|cobró)(?!\w)/i,
    /\bno\s+(existe|hay|tiene|genera|corresponde|amerita)\s+cargo\b/i,
    /\bsin\s+cargo\b/i,
    /\bno\s+debe(\s+de)?\s+cargarse\b/i,
    /\bno\s+requiere\s+(toma\s+de\s+sangre|perfil\s+hormonal|cargo)\b/i,
    /\bno\s+se\s+(le\s+)?toma(n)?\s+(perfil\s+hormonal|estudios?)\b/i,
    /\bse\s+cancel[oó]\s+el\s+ciclo\b/i,
    /\bno\s+(lleg[oó]|llega)\s+a\s+(la\s+)?cita\b/i,
    // 2026-10-01: la ejecutiva reporta "no se realizó la cita/el procedimiento" --
    // la cita no se llevó a cabo, así que no debía generar cargo. Se trata igual
    // que los demás casos de "no se esperaba cargo" (ver nota arriba).
    /\bno\s+se\s+realiz[oó](?!\w)/i,
    /\bno\s+se\s+llev[oó]\s+a\s+cabo\b/i
  ];
  function justificaSinCargo(texto) {
    if (!texto) return false;
    for (var i = 0; i < SIN_CARGO_PATTERNS.length; i++) {
      if (SIN_CARGO_PATTERNS[i].test(texto)) return true;
    }
    return false;
  }

  // 2026-09-21: distinto a SIN_CARGO_PATTERNS (que dice "no se esperaba cargo").
  // Estas frases son lo OPUESTO: el comentario afirma que el cargo SÍ se aplicó
  // ("se cargó...", "ya se cargó...") pero la casilla "Ya tiene cargo" se quedó
  // sin marcar -- típicamente porque el texto se escribió como nota y se olvidó
  // marcar la casilla. El comentario sí se guardó -- el caso es que nada mueve
  // el % sin la casilla. Esto NO resuelve el caso automáticamente (solo un
  // humano debe confirmar marcando la casilla); solo lo resalta en la tabla
  // para que salte a la vista.
  var CARGO_YA_APLICADO_PATTERNS = [
    /\bse\s+carg(o|ó)\b/i,
    /\bya\s+(se\s+)?carg(o|ó)\b/i,
    /\bya\s+(esta|está)\s+cargad[oa]\b/i,
    /\bcargo\s+ya\s+(hecho|realizado|aplicado)\b/i
  ];
  function pareceCargoYaAplicadoSinCheck(row, note) {
    if (!note || note.cargado || !note.text) return false;
    if (row.estatus !== 'Sin Match' && row.estatus !== 'Fuera de Rango de Fecha') return false;
    for (var i = 0; i < CARGO_YA_APLICADO_PATTERNS.length; i++) {
      if (CARGO_YA_APLICADO_PATTERNS[i].test(note.text)) return true;
    }
    return false;
  }

  var state = { sede: 'ALL', statusFilter: 'ALL', search: '', grupo: 'ALL', ejecutiva: 'ALL', mes: 'ALL', searchPgt: '' };

  var MESES_ES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  function mesLabel(mesKey) {
    // mesKey = 'YYYY-MM'
    var p = mesKey.split('-');
    var nombre = MESES_ES[parseInt(p[1], 10) - 1];
    return nombre.charAt(0).toUpperCase() + nombre.slice(1) + ' ' + p[0];
  }

  // El dashboard solo opera con el año en curso -- cualquier fecha de otro año
  // (dato viejo, error de captura, etc.) no debe aparecer como opción de mes.
  var ANIO_FILTRO_MESES = '2026';

  // Meses presentes en los datos (según fecha de la CITA), de más antiguo a más
  // reciente -- así cuando empiece septiembre, agosto queda disponible como mes
  // cerrado para consultar su % final, sin perder los meses anteriores.
  function getMeses() {
    var present = {};
    DATA.forEach(function (r) { if (r.fecha) present[r.fecha.slice(0, 7)] = true; });
    // Incluye también los meses de DESCUENTOS (fecha de cargo, no de cita) --
    // así el filtro nunca esconde un mes con descuentos aunque no tenga citas
    // en la agenda dentro del alcance actual.
    DESCUENTOS.forEach(function (r) { if (r.fecha) present[r.fecha.slice(0, 7)] = true; });
    // Igual con el Cruce de PGTs (fecha de recepción de la muestra).
    CRUCE_PGT.forEach(function (r) { if (r.fechaRecepcion) present[r.fechaRecepcion.slice(0, 7)] = true; });
    return Object.keys(present).filter(function (m) { return m.slice(0, 4) === ANIO_FILTRO_MESES; }).sort();
  }
  var apiReady = false;
  var saveTimers = {};

  function getAutor() {
    try {
      var a = localStorage.getItem('fi_autor');
      if (!a) {
        a = (window.prompt('¿Cuál es tu nombre? (para identificar tus comentarios ante el equipo)') || '').trim();
        if (a) localStorage.setItem('fi_autor', a);
      }
      return a || 'Anónimo';
    } catch (e) { return 'Anónimo'; }
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  // ---------- helpers ----------
  function fmtInt(n) { return (n || 0).toLocaleString('es-MX'); }
  function pct1(n) { return (isFinite(n) ? n : 0).toFixed(1) + '%'; }
  function fmtMoney(n) {
    return (isFinite(n) ? n : 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tierVar(pct) {
    if (pct >= 80) return 'var(--good)';
    if (pct >= 60) return 'var(--warn)';
    return 'var(--bad)';
  }
  function cargoCount(s) {
    return (s['Match Encontrado'] || 0) + (s['Fuera de Rango de Fecha'] || 0) + (s['No Aplica Cruce (regla)'] || 0) + (s['Justificado (Sin Cargo)'] || 0);
  }

  // Un comentario puede marcar una cita 'Sin Match' o 'Fuera de Rango' como confirmada
  // con cargo por el equipo -- en ese caso, para estadísticas (KPI, barras por grupo)
  // pasa a contar directamente como 'Match Encontrado'. El estatus original de la
  // auditoría no se pierde: sigue visible en la tabla de detalle junto con el chip
  // "✓ Confirmado", y el registro sigue en "Casos a revisar" para que el equipo pueda
  // editar o quitar la confirmación.
  //
  // Aparte, si el comentario explica -- con alguno de los patrones de
  // justificaSinCargo -- que NO se esperaba cargo (y la casilla "Ya tiene cargo" no
  // está marcada, porque de hecho no hay cargo que confirmar), el caso también cuenta
  // como resuelto, bajo el estatus 'Justificado (Sin Cargo)'. Solo aplica a 'Sin
  // Match': 'Fuera de Rango de Fecha' ya cuenta como resuelto de por sí (sí hay un
  // cargo candidato, solo cayó fuera de la ventana de fecha).
  function effectiveStatus(row) {
    var note = COMMENTS[row.id];
    if (!note) return row.estatus;
    if (note.cargado && (row.estatus === 'Sin Match' || row.estatus === 'Fuera de Rango de Fecha')) {
      return 'Match Encontrado';
    }
    if (!note.cargado && row.estatus === 'Sin Match' && justificaSinCargo(note.text)) {
      return 'Justificado (Sin Cargo)';
    }
    return row.estatus;
  }

  function computeStats(records) {
    var s = { total: records.length, 'Match Encontrado': 0, 'Fuera de Rango de Fecha': 0, 'No Aplica Cruce (regla)': 0, 'Justificado (Sin Cargo)': 0, 'Sin Match': 0, 'Concepto No Definido en Reglas': 0 };
    for (var i = 0; i < records.length; i++) {
      var e = effectiveStatus(records[i]);
      if (s[e] === undefined) s[e] = 0;
      s[e]++;
    }
    return s;
  }

  function bySede(records, sedeKey) {
    if (sedeKey === 'ALL') return records;
    return records.filter(function (r) { return r.sede === sedeKey; });
  }

  function byEjecutiva(records, ejecutivaKey) {
    if (ejecutivaKey === 'ALL') return records;
    return records.filter(function (r) { return r.ejecutiva === ejecutivaKey; });
  }

  function byMes(records, mesKey) {
    if (mesKey === 'ALL') return records;
    return records.filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === mesKey; });
  }

  // Registros dentro del alcance actual (sede + ejecutiva + mes). Sirve de base
  // tanto para el KPI y las barras por grupo como para la tabla de detalle.
  //
  // Se excluyen las citas "Fuera de Alcance (posterior a corte)" -- son citas
  // agendadas después de la fecha de corte del cruce, todavía no ocurren, así que no
  // tiene sentido contarlas como pendientes ni como resueltas. Antes se colaban en el
  // total sin aparecer en ningún bucket visible, lo que hacía que el % no cerrara
  // (ej. "0 Sin Match + 0 Fuera de Rango" pero aun así <100%).
  function scopedRecords() {
    return byMes(byEjecutiva(bySede(DATA, state.sede), state.ejecutiva), state.mes).filter(function (r) {
      return r.estatus !== 'Fuera de Alcance (posterior a corte)';
    });
  }

  // DESCUENTOS no tiene sede confiable (ver nota en Code.gs), así que solo respeta
  // el filtro de mes -- no sede ni ejecutiva (esa es justo la dimensión que se rankea).
  function scopedDescuentos() {
    return byMes(DESCUENTOS, state.mes);
  }

  // Agrupa filas de descuento por una llave (ejecutiva o producto/concepto) y
  // rankea por monto total descontado (de mayor a menor). keyFn regresa null para
  // excluir una fila del ranking (p.ej. conceptos vacíos).
  function aggregateDescuentos(records, keyFn, maxRows) {
    var map = {};
    var order = [];
    records.forEach(function (r) {
      var k = keyFn(r);
      if (!k) return;
      if (!map[k]) { map[k] = { key: k, montoTotal: 0, count: 0, sumPct: 0 }; order.push(k); }
      map[k].montoTotal += (r.montoDto || 0);
      map[k].count += 1;
      map[k].sumPct += r.pctDto;
    });
    var arr = order.map(function (k) { return map[k]; });
    arr.forEach(function (x) { x.pctProm = x.count ? x.sumPct / x.count : 0; });
    arr.sort(function (a, b) { return b.montoTotal - a.montoTotal; });
    return typeof maxRows === 'number' ? arr.slice(0, maxRows) : arr;
  }

  function groupStats(records) {
    var byGrupo = {};
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      if (!byGrupo[r.grupo]) byGrupo[r.grupo] = { grupo: r.grupo, total: 0, 'Match Encontrado': 0, 'Fuera de Rango de Fecha': 0, 'No Aplica Cruce (regla)': 0, 'Justificado (Sin Cargo)': 0, 'Sin Match': 0, 'Concepto No Definido en Reglas': 0 };
      byGrupo[r.grupo].total++;
      var e = effectiveStatus(r);
      byGrupo[r.grupo][e] = (byGrupo[r.grupo][e] || 0) + 1;
    }
    var arr = GRUPO_ORDER.filter(function (g) { return byGrupo[g]; }).map(function (g) { return byGrupo[g]; });
    arr.forEach(function (g) { g.pct = g.total ? (cargoCount(g) / g.total) * 100 : 0; });
    arr.sort(function (a, b) { return b.pct - a.pct; });
    return arr;
  }

  function detailRows() {
    var rows = scopedRecords().filter(function (r) {
      return r.estatus === 'Sin Match' || r.estatus === 'Fuera de Rango de Fecha' || r.estatus === 'Concepto No Definido en Reglas';
    });
    if (state.statusFilter !== 'ALL') {
      rows = rows.filter(function (r) {
        if (state.statusFilter === 'SIN') return r.estatus === 'Sin Match';
        if (state.statusFilter === 'FUERA') return r.estatus === 'Fuera de Rango de Fecha';
        return r.estatus === 'Concepto No Definido en Reglas';
      });
    }
    if (state.grupo !== 'ALL') rows = rows.filter(function (r) { return r.grupo === state.grupo; });
    if (state.search.trim()) {
      var q = state.search.trim().toLowerCase();
      rows = rows.filter(function (r) {
        return (r.paciente || '').toLowerCase().indexOf(q) !== -1 ||
          (r.concepto || '').toLowerCase().indexOf(q) !== -1 ||
          (r.profesional || '').toLowerCase().indexOf(q) !== -1 ||
          (r.ejecutiva || '').toLowerCase().indexOf(q) !== -1 ||
          (String(r.nhc || '')).indexOf(q) !== -1;
      });
    }
    rows.sort(function (a, b) {
      if (a.fecha === b.fecha) return (a.paciente || '').localeCompare(b.paciente || '');
      return (b.fecha || '').localeCompare(a.fecha || '');
    });
    return rows;
  }

  // ---------- render: top KPI ----------
  function renderKPI(root) {
    var scoped = scopedRecords();
    var stats = computeStats(scoped);
    var pct = stats.total ? (cargoCount(stats) / stats.total) * 100 : 0;
    var sedeLabel = SEDES.filter(function (s) { return s.key === state.sede; })[0].label;
    var mesLbl = state.mes === 'ALL' ? 'Todo el año' : mesLabel(state.mes);
    var scopeLabel = mesLbl + ' · ' + sedeLabel + (state.ejecutiva !== 'ALL' ? ' · Ejecutiva: ' + state.ejecutiva : '');

    // Pendientes = casos que TODAVÍA no cuentan como resueltos y necesitan revisión
    // humana (excluye los que el equipo ya confirmó con cargo o justificó por
    // comentario -- esos se reclasifican en effectiveStatus()). Incluye "Sin Regla"
    // porque, aunque es un problema distinto (falta definir la regla, no falta el
    // cargo), tampoco cuenta como resuelto y de lo contrario desaparecía del conteo.
    var pendientes = (stats['Sin Match'] || 0) + (stats['Fuera de Rango de Fecha'] || 0) + (stats['Concepto No Definido en Reglas'] || 0);

    var html = '';
    html += '<div class="kpi-grid">';
    html += '<div class="card hero-card">';
    html += '<div class="hero-label">% de cargo ya resuelto &middot; ' + escapeHtml(scopeLabel) + '</div>';
    html += '<div class="hero-num" style="color:' + tierVar(pct) + '">' + pct1(pct) + '</div>';
    html += '<div class="hero-sub">' + fmtInt(cargoCount(stats)) + ' de ' + fmtInt(stats.total) + ' citas ya con cargo, fuera de rango, no aplica (incluye duplicadas GDL), confirmadas o justificadas por comentario del equipo &mdash; quedan <strong>' + fmtInt(pendientes) + ' pendientes</strong> por revisar (incluye ' + fmtInt(stats['Concepto No Definido en Reglas'] || 0) + ' sin regla definida)</div>';
    html += '</div>';

    html += '<div class="stat-grid">';
    // "Concepto No Definido en Reglas" (Sin Regla) no se muestra como tarjeta aquí --
    // suele quedar en 0 o casi 0 y duplicaba info ya visible en "Casos a revisar" (el
    // filtro "Solo Sin Regla"). Sigue contando en el % y en "pendientes" (ver abajo).
    var order = ['Match Encontrado', 'Sin Match', 'Fuera de Rango de Fecha', 'No Aplica Cruce (regla)', 'Justificado (Sin Cargo)'];
    order.forEach(function (key) {
      var meta = STATUS_META[key];
      var n = stats[key] || 0;
      var p = stats.total ? (n / stats.total) * 100 : 0;
      html += '<div class="card stat">';
      html += '<div class="lbl"><span class="dot" style="background:var(' + meta.varName + ')"></span>' + escapeHtml(meta.short) + '</div>';
      html += '<div class="n" style="color:var(' + meta.varName + ')">' + fmtInt(n) + '</div>';
      html += '<div class="pct">' + pct1(p) + ' del total</div>';
      html += '</div>';
    });
    html += '</div>'; // stat-grid
    html += '</div>'; // kpi-grid
    root.innerHTML = html;
  }

  // ---------- render: grupo bars ----------
  function renderGrupoBars(root) {
    var scoped = scopedRecords();
    var groups = groupStats(scoped);
    var html = '<div class="card bars">';
    groups.forEach(function (g) {
      html += '<div class="bar-row">';
      html += '<div class="name">' + escapeHtml(g.grupo) + '</div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(g.pct, 1.5) + '%;background:' + tierVar(g.pct) + '"></div></div>';
      html += '<div class="bar-val">' + pct1(g.pct) + ' &middot; ' + fmtInt(g.total) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    root.innerHTML = html;
  }

  // ---------- render: descuentos ----------
  function descuentoTableHtml(title, rows, labelHeader) {
    var html = '<div class="card">';
    html += '<div class="descuento-card-title">' + escapeHtml(title) + '</div>';
    if (!rows.length) {
      html += '<div class="empty">Sin descuentos registrados en este alcance.</div>';
    } else {
      html += '<table class="descuento-table"><thead><tr>' +
        '<th>' + escapeHtml(labelHeader) + '</th><th>Monto descontado</th><th>Cargos c/ dto.</th><th>% Dto. prom.</th>' +
        '</tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>';
        html += '<td>' + escapeHtml(r.key) + '</td>';
        html += '<td class="money">' + fmtMoney(r.montoTotal) + '</td>';
        html += '<td>' + fmtInt(r.count) + '</td>';
        html += '<td>' + pct1(r.pctProm) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    return html;
  }

  function renderDescuentos(root) {
    var scoped = scopedDescuentos();
    var porEjecutiva = aggregateDescuentos(scoped, function (r) { return r.ejecutiva || 'Sin asignar'; }, 15);
    var porProducto = aggregateDescuentos(scoped, function (r) { return r.concepto || null; }, 15);
    var montoTotal = scoped.reduce(function (acc, r) { return acc + (r.montoDto || 0); }, 0);

    var html = '<div class="note" style="margin-bottom:14px">' +
      fmtInt(scoped.length) + ' cargos con descuento &middot; ' + fmtMoney(montoTotal) + ' descontado en total ' +
      '(según fecha de cargo, mismo filtro de mes que arriba). "Cargos c/ dto." cuenta solo filas con % Dto. &gt; 0.</div>';
    html += '<div class="descuento-grid">';
    html += descuentoTableHtml('Ejecutivas con más descuento', porEjecutiva, 'Ejecutiva');
    html += descuentoTableHtml('Productos con más descuento', porProducto, 'Producto / concepto');
    html += '</div>';
    root.innerHTML = html;
  }

  // ---------- render: cruce de PGTs - Proveedor y cargos ----------
  // Respeta el filtro de mes (según fecha de recepción de la muestra) para que se
  // pueda revisar un mes cerrado a la vez, igual que el resto del dashboard -- no
  // se filtra por sede/ejecutiva porque "Base proveedores PGT" no trae esos datos.
  function byMesPgt(records, mesKey) {
    if (mesKey === 'ALL') return records;
    return records.filter(function (r) { return r.fechaRecepcion && r.fechaRecepcion.slice(0, 7) === mesKey; });
  }

  function crucePgtScoped() {
    return byMesPgt(CRUCE_PGT, state.mes);
  }

  // Un checkbox "Ya tiene cargo (confirmado)" en la última columna reclasifica la
  // factura como resuelta, igual que en el cruce principal (ver effectiveStatus) --
  // usa el mismo COMMENTS global, por id, así que reutiliza el mismo componente de
  // guardado (commentCellHtml / wireCommentInputs / saveRow) sin cambios.
  function effectivePgtStatus(row) {
    var note = COMMENTS[row.id];
    if (note && note.cargado) return 'Match Encontrado';
    return row.estatus;
  }

  function crucePgtCounts(records) {
    var counts = { 'Match Encontrado': 0, 'Sin Match': 0, 'Fuera de Rango': 0 };
    records.forEach(function (r) {
      var e = effectivePgtStatus(r);
      counts[e] = (counts[e] || 0) + 1;
    });
    return counts;
  }

  // Solo las facturas todavía sin resolver (por su estatus original del motor, no
  // el efectivo) entran a la tabla de detalle -- así, cuando el equipo marca una
  // como confirmada, la fila se queda visible con su estilo "confirmada" en vez de
  // desaparecer de golpe (mismo criterio que "Casos a revisar" en el cruce principal).
  function crucePgtDetailRows() {
    var rows = crucePgtScoped().filter(function (r) {
      return r.estatus === 'Sin Match' || r.estatus === 'Fuera de Rango';
    });
    if (state.searchPgt.trim()) {
      var q = state.searchPgt.trim().toLowerCase();
      rows = rows.filter(function (r) {
        return (r.paciente || '').toLowerCase().indexOf(q) !== -1 ||
          (r.cargoConcepto || '').toLowerCase().indexOf(q) !== -1 ||
          (String(r.idOrdenLims || '')).toLowerCase().indexOf(q) !== -1;
      });
    }
    return rows;
  }

  // ---------- render: cruce de PGTs -- cuadro resumen (arriba de la tabla) ----------
  function renderCrucePgtSummary(root) {
    var scoped = crucePgtScoped();
    var counts = crucePgtCounts(scoped);
    var total = scoped.length;
    var pct = total ? (counts['Match Encontrado'] / total) * 100 : 0;

    var html = '<div class="kpi-grid">';
    html += '<div class="card hero-card">';
    html += '<div class="hero-label">% de facturas PGT con cargo encontrado</div>';
    html += '<div class="hero-num" style="color:' + tierVar(pct) + '">' + pct1(pct) + '</div>';
    html += '<div class="hero-sub">' + fmtInt(counts['Match Encontrado']) + ' de ' + fmtInt(total) + ' facturas de proveedor ya con su cargo correspondiente al paciente en el mes esperado.</div>';
    html += '</div>';
    html += '<div class="stat-grid">';
    var order = [
      { key: 'Match Encontrado', label: 'Match', varName: '--good' },
      { key: 'Sin Match', label: 'Sin Match', varName: '--bad' },
      { key: 'Fuera de Rango', label: 'Fuera de Rango', varName: '--warn' }
    ];
    order.forEach(function (o) {
      var n = counts[o.key] || 0;
      var p = total ? (n / total) * 100 : 0;
      html += '<div class="card stat">';
      html += '<div class="lbl"><span class="dot" style="background:var(' + o.varName + ')"></span>' + escapeHtml(o.label) + '</div>';
      html += '<div class="n" style="color:var(' + o.varName + ')">' + fmtInt(n) + '</div>';
      html += '<div class="pct">' + pct1(p) + ' del total</div>';
      html += '</div>';
    });
    html += '</div>'; // stat-grid
    html += '</div>'; // kpi-grid
    root.innerHTML = html;
  }

  // ---------- render: cruce de PGTs -- tabla de facturas sin cargo ----------
  function renderCrucePGT(root) {
    var rows = crucePgtDetailRows();
    var totalPendientes = crucePgtScoped().filter(function (r) {
      return r.estatus === 'Sin Match' || r.estatus === 'Fuera de Rango';
    }).length;

    var html = '<div class="toolbar">';
    html += '<input class="search" id="fi-pgt-search" type="text" placeholder="Buscar por paciente, concepto o ID Orden LIMS…" value="' + escapeHtml(state.searchPgt) + '">';
    html += '<span class="count-badge">' + fmtInt(rows.length) + ' registros</span>';
    html += '</div>';

    if (!rows.length) {
      var emptyMsg = totalPendientes ? 'Sin resultados para esta búsqueda.' : 'No quedan facturas de proveedor PGT sin cargo en este alcance.';
      html += '<div class="table-wrap"><div class="empty">' + emptyMsg + '</div></div>';
      root.innerHTML = html;
      return;
    }

    html += '<div class="table-wrap"><table><thead><tr>' +
      '<th>Paciente</th><th>Fecha recepción</th><th>Fecha entrega reporte</th><th>ID Orden LIMS</th><th>Costo proveedor</th>' +
      '<th>Estatus</th><th>Cargo relacionado</th><th>Comentario</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (r) {
      var note = COMMENTS[r.id];
      var confirmado = note && note.cargado;
      var chipClass = r.estatus === 'Fuera de Rango' ? 'fuera' : 'sin';
      var chipLabel = r.estatus === 'Fuera de Rango' ? 'Fuera de Rango' : 'Sin Match';
      html += '<tr' + (confirmado ? ' class="row-confirmed"' : '') + '>';
      html += '<td>' + escapeHtml(r.paciente) + '</td>';
      html += '<td>' + fmtDate(r.fechaRecepcion) + '</td>';
      html += '<td>' + fmtDate(r.fechaEntregaReporte) + '</td>';
      html += '<td>' + escapeHtml(r.idOrdenLims) + '</td>';
      html += '<td class="diff">' + (r.costo !== null && r.costo !== undefined ? fmtMoney(r.costo) : '—') + '</td>';
      html += '<td><span class="chip ' + chipClass + '">' + chipLabel + '</span>' +
        (confirmado ? ' <span class="chip confirm">✓ Confirmado</span>' : '') + '</td>';
      html += '<td class="cargo-cell">' + (r.estatus === 'Fuera de Rango'
        ? '<span class="cc">' + escapeHtml(r.cargoConcepto) + '</span>' + fmtDate(r.cargoFecha) + ' (mes distinto)'
        : '—') + '</td>';
      html += '<td>' + commentCellHtml(r) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    root.innerHTML = html;
    wireCommentInputs(root);
  }

  // ---------- render: detail table ----------
  function commentCellHtml(row) {
    var note = COMMENTS[row.id] || { text: '', cargado: false };
    var disabledAttr = apiReady ? '' : 'disabled';
    var html = '<label class="confirm-check">' +
      '<input type="checkbox" class="confirm-checkbox" data-id="' + escapeHtml(row.id) + '" ' + (note.cargado ? 'checked' : '') + ' ' + disabledAttr + '>' +
      ' Ya tiene cargo (confirmado)</label>';
    html += '<textarea class="comment-input" data-id="' + escapeHtml(row.id) + '" placeholder="Agregar comentario…" ' + disabledAttr + '>' + escapeHtml(note.text || '') + '</textarea>';
    html += '<div class="save-state" data-savestate="' + escapeHtml(row.id) + '"></div>';
    return html;
  }

  function renderTable(root) {
    var rows = detailRows();
    var html = '';
    html += '<div class="toolbar">';
    html += '<input class="search" id="fi-search" type="text" placeholder="Buscar por paciente, concepto, profesional o NHC…" value="' + escapeHtml(state.search) + '">';
    html += '<select class="pill" id="fi-grupo-filter" style="cursor:pointer">';
    html += '<option value="ALL"' + (state.grupo === 'ALL' ? ' selected' : '') + '>Todos los grupos</option>';
    GRUPO_ORDER.forEach(function (g) {
      html += '<option value="' + escapeHtml(g) + '"' + (state.grupo === g ? ' selected' : '') + '>' + escapeHtml(g) + '</option>';
    });
    html += '</select>';
    html += '<span class="count-badge">' + fmtInt(rows.length) + ' registros</span>';
    html += '</div>';

    if (!rows.length) {
      html += '<div class="table-wrap"><div class="empty">No hay registros con estos filtros.</div></div>';
      root.innerHTML = html;
      return;
    }

    html += '<div class="table-wrap"><table><thead><tr>' +
      '<th>Grupo</th><th>Sede</th><th>Paciente</th><th>Fecha cita</th><th>Concepto agenda</th>' +
      '<th>Estatus</th><th>Cargo candidato</th><th>Dif. días</th><th>Profesional</th><th>Ejecutiva</th><th>Comentario</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function (r) {
      var meta = STATUS_META[r.estatus];
      var chipClass = r.estatus === 'Fuera de Rango de Fecha' ? 'fuera' : 'sin';
      var note = COMMENTS[r.id];
      var confirmado = note && note.cargado;
      var justificado = !confirmado && r.estatus === 'Sin Match' && note && justificaSinCargo(note.text);
      var faltaCheck = !confirmado && !justificado && pareceCargoYaAplicadoSinCheck(r, note);
      html += '<tr' + (confirmado ? ' class="row-confirmed"' : (justificado ? ' class="row-justified"' : (faltaCheck ? ' class="row-falta-check"' : ''))) + '>';
      html += '<td>' + escapeHtml(r.grupo) + '</td>';
      html += '<td><span class="chip sede">' + escapeHtml(r.sede) + '</span></td>';
      html += '<td>' + escapeHtml(r.paciente) + (r.nhc ? '<br><span style="color:var(--muted);font-size:11px">' + escapeHtml(r.nhc) + '</span>' : '') + '</td>';
      html += '<td>' + fmtDate(r.fecha) + '</td>';
      html += '<td>' + escapeHtml(r.concepto) + '</td>';
      html += '<td><span class="chip ' + chipClass + '">' + escapeHtml(meta.short) + '</span>' +
        (confirmado ? ' <span class="chip confirm">✓ Confirmado</span>' : '') +
        (justificado ? ' <span class="chip justified">◆ Justificado</span>' : '') +
        (faltaCheck ? ' <span class="chip falta-check" title="El comentario dice que ya se cargó, pero falta marcar la casilla &quot;Ya tiene cargo&quot;">⚠ Falta marcar casilla</span>' : '') + '</td>';
      if (r.estatus === 'Fuera de Rango de Fecha') {
        html += '<td class="cargo-cell"><span class="cc">' + escapeHtml(r.conceptoCargo) + '</span>' + fmtDate(r.fechaCargo) + '</td>';
        html += '<td class="diff">' + (r.diffDias > 0 ? '+' : '') + r.diffDias + 'd</td>';
      } else {
        html += '<td class="cargo-cell">—</td><td class="diff">—</td>';
      }
      html += '<td>' + escapeHtml(r.profesional) + '</td>';
      html += '<td>' + (r.ejecutiva === 'Sin asignar' ? '<span class="chip" style="background:var(--warn-bg);color:var(--warn)">Sin asignar</span>' : escapeHtml(r.ejecutiva)) + '</td>';
      html += '<td>' + commentCellHtml(r) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    root.innerHTML = html;
    wireCommentInputs(root);
  }

  // ---------- render: pills ----------
  function renderSedePills(root) {
    var html = '';
    SEDES.forEach(function (s) {
      html += '<button class="pill' + (state.sede === s.key ? ' active' : '') + '" data-sede="' + s.key + '">' + escapeHtml(s.label) + '</button>';
    });
    root.innerHTML = html;
  }

  function renderEjecutivaFilter(root) {
    var html = '<select class="pill" id="fi-ejecutiva-filter" style="cursor:pointer">';
    html += '<option value="ALL"' + (state.ejecutiva === 'ALL' ? ' selected' : '') + '>Todas las ejecutivas</option>';
    getEjecutivas().forEach(function (e) {
      html += '<option value="' + escapeHtml(e) + '"' + (state.ejecutiva === e ? ' selected' : '') + '>' + escapeHtml(e) + '</option>';
    });
    html += '</select>';
    root.innerHTML = html;
  }

  function renderMesFilter(root) {
    var meses = getMeses();
    var html = '<select class="pill" id="fi-mes-filter" style="cursor:pointer">';
    html += '<option value="ALL"' + (state.mes === 'ALL' ? ' selected' : '') + '>Todo el año</option>';
    meses.forEach(function (m) {
      html += '<option value="' + m + '"' + (state.mes === m ? ' selected' : '') + '>' + escapeHtml(mesLabel(m)) + '</option>';
    });
    html += '</select>';
    root.innerHTML = html;
  }

  function renderStatusPills(root) {
    var opts = [
      { key: 'ALL', label: 'Todos' },
      { key: 'SIN', label: 'Solo Sin Match' },
      { key: 'FUERA', label: 'Solo Fuera de Rango' },
      { key: 'SINREGLA', label: 'Solo Sin Regla' }
    ];
    var html = '';
    opts.forEach(function (o) {
      html += '<button class="pill' + (state.statusFilter === o.key ? ' active' : '') + '" data-status="' + o.key + '">' + escapeHtml(o.label) + '</button>';
    });
    root.innerHTML = html;
  }

  // ---------- full render ----------
  function render() {
    renderSedePills(document.getElementById('fi-sede-pills'));
    renderEjecutivaFilter(document.getElementById('fi-ejecutiva-filter-wrap'));
    renderMesFilter(document.getElementById('fi-mes-filter-wrap'));
    renderKPI(document.getElementById('fi-kpi'));
    renderGrupoBars(document.getElementById('fi-bars'));
    renderStatusPills(document.getElementById('fi-status-pills'));
    renderTable(document.getElementById('fi-table'));
    renderCrucePgtSummary(document.getElementById('fi-pgt-summary'));
    renderCrucePGT(document.getElementById('fi-pgt'));
    renderDescuentos(document.getElementById('fi-descuentos'));
    wireTopEvents();
  }

  // renderTable() y renderCrucePGT() reemplazan su propio toolbar (con el
  // input de búsqueda y el select de grupo) cada vez que se re-renderizan -- eso
  // destruye el elemento DOM anterior y, con él, cualquier listener pegado
  // directamente. Por eso estos dos "wire*" son funciones aparte que se pueden
  // volver a invocar después de cada re-render parcial, no solo una vez al
  // inicio: si no, la búsqueda deja de reaccionar después de la primera tecla.
  function wireDetailToolbar() {
    var searchEl = document.getElementById('fi-search');
    if (searchEl) {
      searchEl.addEventListener('input', function () {
        state.search = searchEl.value;
        renderTable(document.getElementById('fi-table'));
        wireDetailToolbar();
        // restore focus + caret since el toolbar se re-renderizó
        var el = document.getElementById('fi-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    var grupoSel = document.getElementById('fi-grupo-filter');
    if (grupoSel) {
      grupoSel.addEventListener('change', function () {
        state.grupo = grupoSel.value;
        renderTable(document.getElementById('fi-table'));
        wireDetailToolbar();
      });
    }
  }

  function wireCrucePgtSearch() {
    var pgtSearchEl = document.getElementById('fi-pgt-search');
    if (pgtSearchEl) {
      pgtSearchEl.addEventListener('input', function () {
        state.searchPgt = pgtSearchEl.value;
        renderCrucePGT(document.getElementById('fi-pgt'));
        wireCrucePgtSearch();
        var el = document.getElementById('fi-pgt-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
  }

  function wireTopEvents() {
    var sedePills = document.querySelectorAll('#fi-sede-pills .pill');
    sedePills.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.sede = btn.getAttribute('data-sede');
        render();
      });
    });
    var statusPills = document.querySelectorAll('#fi-status-pills .pill');
    statusPills.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.statusFilter = btn.getAttribute('data-status');
        renderTable(document.getElementById('fi-table'));
        wireDetailToolbar();
        renderStatusPillsOnly();
      });
    });
    wireDetailToolbar();
    var ejecutivaSel = document.getElementById('fi-ejecutiva-filter');
    if (ejecutivaSel) {
      ejecutivaSel.addEventListener('change', function () {
        state.ejecutiva = ejecutivaSel.value;
        render();
      });
    }
    var mesSel = document.getElementById('fi-mes-filter');
    if (mesSel) {
      mesSel.addEventListener('change', function () {
        state.mes = mesSel.value;
        render();
      });
    }
    wireCrucePgtSearch();
  }

  function renderStatusPillsOnly() {
    renderStatusPills(document.getElementById('fi-status-pills'));
    var statusPills = document.querySelectorAll('#fi-status-pills .pill');
    statusPills.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.statusFilter = btn.getAttribute('data-status');
        renderTable(document.getElementById('fi-table'));
        renderStatusPillsOnly();
      });
    });
  }

  // ---------- comments ----------
  function wireCommentInputs(root) {
    var inputs = root.querySelectorAll('.comment-input');
    inputs.forEach(function (el) {
      el.addEventListener('input', function () {
        var id = el.getAttribute('data-id');
        var stateEl = root.querySelector('[data-savestate="' + cssEscape(id) + '"]');
        if (stateEl) stateEl.textContent = 'Escribiendo…';
        if (saveTimers[id]) clearTimeout(saveTimers[id]);
        saveTimers[id] = setTimeout(function () { saveRow(id, { text: el.value }, stateEl, false); }, 900);
      });
    });
    var checks = root.querySelectorAll('.confirm-checkbox');
    checks.forEach(function (el) {
      el.addEventListener('change', function () {
        var id = el.getAttribute('data-id');
        var stateEl = root.querySelector('[data-savestate="' + cssEscape(id) + '"]');
        updateRowConfirmedVisual(el, el.checked);
        // El checkbox cambia el % de cargo (KPIs y barras), así que sí se re-renderiza esa parte.
        saveRow(id, { cargado: el.checked }, stateEl, true);
      });
    });
  }

  function updateRowConfirmedVisual(checkboxEl, checked) {
    var tr = checkboxEl.closest('tr');
    if (!tr) return;
    tr.classList.toggle('row-confirmed', checked);
    var estatusCell = tr.querySelector('td:nth-child(6)');
    if (!estatusCell) return;
    var existingChip = estatusCell.querySelector('.chip.confirm');
    if (checked && !existingChip) {
      var span = document.createElement('span');
      span.className = 'chip confirm';
      span.style.marginLeft = '6px';
      span.textContent = '✓ Confirmado';
      estatusCell.appendChild(span);
    } else if (!checked && existingChip) {
      existingChip.remove();
    }
  }

  function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  function saveRow(id, patch, stateEl, rerenderStats) {
    var current = COMMENTS[id] || { text: '', cargado: false };
    var next = { text: patch.text !== undefined ? patch.text.trim() : (current.text || ''), cargado: patch.cargado !== undefined ? patch.cargado : !!current.cargado };
    if (next.text || next.cargado) COMMENTS[id] = next; else delete COMMENTS[id];

    if (rerenderStats) {
      renderKPI(document.getElementById('fi-kpi'));
      renderGrupoBars(document.getElementById('fi-bars'));
      // Comparte COMMENTS con el cruce de PGTs -- un checkbox de cualquiera de las
      // dos tablas puede mover sus conteos, así que se refresca también ese resumen
      // (la propia fila ya se actualiza sin re-render vía updateRowConfirmedVisual).
      var pgtSummaryEl = document.getElementById('fi-pgt-summary');
      if (pgtSummaryEl) renderCrucePgtSummary(pgtSummaryEl);
    }

    if (!apiReady) {
      if (stateEl) stateEl.textContent = 'Sin conexión de guardado — no se compartirá con el equipo';
      return;
    }
    if (stateEl) stateEl.textContent = 'Guardando…';
    var autor = getAutor();
    fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ id: id, cargado: next.cargado, texto: next.text, autor: autor })
    }).then(function (r) { return r.json(); }).then(function (resp) {
      if (resp && resp.ok) {
        if (stateEl) stateEl.textContent = 'Guardado ✓ — visible para todo el equipo (' + autor + ')';
      } else {
        if (stateEl) stateEl.textContent = 'No se pudo guardar: ' + ((resp && resp.error) || 'error desconocido');
      }
    }).catch(function () {
      if (stateEl) stateEl.textContent = 'No se pudo guardar (revisa tu conexión a internet) — vuelve a intentar';
    });
  }

  // ---------- boot: carga de datos en vivo ----------
  function showReadOnlyBanner(msg) {
    var b = document.getElementById('fi-readonly-banner');
    if (b) { b.style.display = 'block'; if (msg) b.textContent = msg; }
  }
  function hideReadOnlyBanner() {
    var b = document.getElementById('fi-readonly-banner');
    if (b) b.style.display = 'none';
  }

  function loadData() {
    var loadEl = document.getElementById('fi-load-status');
    if (loadEl) loadEl.textContent = 'Cargando datos en vivo desde tu Google Sheet… (puede tardar 20-40 segundos, lee y cruza miles de filas cada vez — no recargues la página)';
    fetch(WEBAPP_URL)
      .then(function (r) { return r.json(); })
      .then(function (resp) {
        if (!resp || !resp.ok) throw new Error((resp && resp.error) || 'Respuesta inválida del servidor');
        DATA = resp.registros || [];
        DESCUENTOS = resp.descuentoRegistros || [];
        CRUCE_PGT = resp.crucePGT || [];
        COMMENTS = {};
        Object.keys(resp.comentarios || {}).forEach(function (id) {
          var c = resp.comentarios[id];
          COMMENTS[id] = { text: c.texto || '', cargado: !!c.cargado };
        });
        var corteEl = document.getElementById('fi-corte-label');
        if (corteEl) corteEl.textContent = 'corte al ' + fmtDate(resp.corte) + ' · actualizado ' + fmtDateTime(resp.generadoEn);
        apiReady = true;
        hideReadOnlyBanner();
        if (loadEl) loadEl.textContent = '';
        render();
      })
      .catch(function (err) {
        apiReady = false;
        showReadOnlyBanner('No se pudieron cargar los datos en vivo (' + err.message + '). ' +
          'Revisa que el Apps Script siga desplegado con acceso "Cualquier usuario", o vuelve a intentar.');
        if (loadEl) {
          loadEl.innerHTML = 'No se pudo conectar con la Google Sheet. <button id="fi-retry" class="pill" style="cursor:pointer">Reintentar</button>';
          var retryBtn = document.getElementById('fi-retry');
          if (retryBtn) retryBtn.addEventListener('click', loadData);
        }
        render();
      });
  }

  function buildShell() {
    var root = document.getElementById('root');
    var html = '';
    html += '<div class="topbar"><div class="topbar-inner">' +
      '<div class="brand"><h1>Cruce de Cargos</h1><p>Fertilidad Integral &middot; Revenue Management &middot; <span id="fi-corte-label">' + CORTE_LABEL + '</span></p></div>' +
      '<div class="pillrow" id="fi-sede-pills"></div>' +
      '<div class="pillrow" id="fi-ejecutiva-filter-wrap"></div>' +
      '<div class="pillrow" id="fi-mes-filter-wrap"></div>' +
      '</div></div>';
    html += '<div id="root-body">' +
      '<div id="fi-load-status" class="note" style="padding:10px 24px"></div>' +
      '<div class="readonly-banner" id="fi-readonly-banner" style="display:none">Esta vista no tiene conexión de guardado activa: los comentarios se pueden escribir pero no se compartirán con el equipo hasta que se abra desde una sesión con guardado habilitado.</div>' +
      '<section><div class="section-head"><h2>% de conversión</h2><div class="note">Qué tanto de la agenda ya quedó resuelto: tiene cargo, está fuera de rango (para revisar), no requiere cargo por regla, el equipo ya confirmó que sí se cobró, o el comentario explica por qué no se esperaba cargo (justificado). No incluye citas todavía futuras (posteriores a la fecha de corte) ni cuenta como resuelto un concepto sin regla definida (Sin Regla, sigue pendiente). <strong>No es lo que falta</strong> — entre más alto, mejor.</div></div>' +
      '<div id="fi-kpi"></div></section>' +
      '<section><div class="section-head"><h2>Distribución por grupo</h2><div class="note">% ya resuelto de cada tipo de cita (mismo criterio de arriba), de mayor a menor. Un grupo con % bajo es el que más casos pendientes tiene por revisar.</div></div>' +
      '<div id="fi-bars"></div></section>' +
      '<section><div class="section-head"><h2>Casos a revisar</h2><div class="note">Comenta si detectas que falta una regla, un concepto de cargo o una excepción — sirve como conocimiento para el equipo. Si confirmas "Ya tiene cargo", ese caso se suma al % de cargo de arriba. Si el comentario explica que NO se espera cargo (p.ej. "no requiere toma de sangre porque es inseminación", "se canceló el ciclo"), el caso se marca automáticamente como <span class="chip justified" style="vertical-align:1px">◆ Justificado</span> y también cuenta como resuelto, sin marcar la casilla. Los de chip "Sin Regla" son distintos: el concepto de esa cita no tiene ninguna fila en tu hoja Reglas (ni SI ni NO) — agrégala ahí para que deje de aparecer aquí.</div></div>' +
      '<div class="pillrow" id="fi-status-pills" style="margin-bottom:14px"></div>' +
      '<div id="fi-table"></div></section>' +
      '<section><div class="section-head"><h2>Cruce de PGTs - Proveedor y cargos</h2><div class="note">Por cada factura que un proveedor de PGT ya envió ("Base proveedores PGT"), verifica que el paciente tenga un cargo correspondiente en CARGOS (concepto de "Regla proveedores PGT" columna G) dentro del mes de recepción de la muestra y/o de entrega del reporte. La tabla de abajo solo muestra las que todavía no tienen cargo — marca "Ya tiene cargo" si lo confirmas a mano (cuenta como match) o deja un comentario.</div></div>' +
      '<div id="fi-pgt-summary" style="margin-bottom:18px"></div>' +
      '<div id="fi-pgt"></div></section>' +
      '<section><div class="section-head"><h2>Descuentos</h2><div class="note">Qué ejecutiva y qué producto concentran más descuento, según la columna "% Dto." de CARGOS. La ejecutiva se determina por el médico (Profesional / Profesional Historia del cargo) — CARGOS no trae sede confiable, así que este ranking solo se filtra por mes, no por sede.</div></div>' +
      '<div id="fi-descuentos"></div></section>' +
      '<footer>Fertilidad Integral — Auditoría de cruce Agenda vs. Cargos</footer>' +
      '</div>';
    root.innerHTML = html;
  }

  buildShell();
  render();
  loadData();
})();

</script>
